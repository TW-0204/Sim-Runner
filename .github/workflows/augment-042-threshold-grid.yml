name: AUG-042 Threshold Grid

on:
  push:
    paths:
      - '.github/workflows/augment-042-threshold-grid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  threshold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        targets:
          - '6,11,15'
          - '6,12,15'
          - '6,12,16'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Run AUG-042 threshold precision
        run: node --import ./scripts/register-ts-hooks.mjs scripts/augment-042-threshold-run.ts --targets "${{ matrix.targets }}" --games 1000 --output-dir augment-042-threshold-results

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: augment-042-refine-${{ strategy.job-index }}
          path: augment-042-threshold-results/
          if-no-files-found: warn
          retention-days: 7
