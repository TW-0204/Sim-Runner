name: migrate turn lifecycle once

on:
  push:
    branches:
      - refactor/canonical-v11
    paths:
      - 'archive/migrations/refactor-turn-lifecycle-once.py'
      - '.github/workflows/migrate-turn-lifecycle-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-v11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Consolidate automatic turn lifecycle
        run: python archive/migrations/refactor-turn-lifecycle-once.py
      - name: Run canonical smoke
        run: bash scripts/run-s16-p10-smoke.sh
      - name: Run historical regressions
        run: node --import ./scripts/register-ts-hooks.mjs scripts/canonical-regression-seeds.ts
      - name: Commit turn lifecycle refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/game/engine.ts src/lib/simulation/game.ts
          git commit -m "refactor: move automatic turn rules into game lifecycle"
          git push origin HEAD:refactor/canonical-v11
