name: source consolidate canonical v11 once

on:
  push:
    branches:
      - refactor/canonical-v11

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-v11
          fetch-depth: 0
      - name: Remove forced-precision source mutation
        run: python scripts/refactor-critical-force-once.py
      - name: Consolidate canonical source
        run: python scripts/consolidate-source-only-once.py
      - name: Commit source consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md src scripts archive/legacy-patches
          git commit -m "refactor: canonicalize source and retire patch execution"
          git push origin HEAD:refactor/canonical-v11
