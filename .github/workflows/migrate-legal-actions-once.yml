name: migrate legal actions once

on:
  push:
    branches:
      - refactor/canonical-v11
    paths:
      - 'archive/migrations/refactor-legal-actions-once.py'
      - '.github/workflows/migrate-legal-actions-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-v11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Consolidate legal actions into engine
        run: python archive/migrations/refactor-legal-actions-once.py
      - name: Run canonical smoke
        run: bash scripts/run-s16-p10-smoke.sh
      - name: Run exact stall regressions
        run: node --import ./scripts/register-ts-hooks.mjs scripts/critical-stall-diagnose.ts
      - name: Require exact seeds to resolve
        run: |
          python - <<'PY'
          import json
          data=json.load(open('critical-stall-diagnostics/diagnostics.json', encoding='utf-8'))
          bad=[r for r in data['reports'] if r['status'] != 'COMPLETED']
          if bad:
              for row in bad:
                  print(row['augmentId'], row['seed'], row['status'], row.get('error'))
              raise SystemExit(1)
          print('all exact stall regressions COMPLETED')
          PY
      - name: Commit legal action consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/game/engine.ts src/lib/simulation/game.ts
          git commit -m "refactor: make engine own legal move resolution"
          git push origin HEAD:refactor/canonical-v11
