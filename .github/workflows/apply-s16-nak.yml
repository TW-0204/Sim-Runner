name: Apply S16 Nak Experiment

on:
  push:
    paths:
      - '.github/workflows/apply-s16-nak.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/s16
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch S16 experiment
        run: python scripts/apply-s16-experiment.py
      - name: Commit S16 experiment
        run: |
          git config user.name "TW-0204"
          git config user.email "leetwoong0204@gmail.com"
          git add src/lib/augments/catalog.ts src/lib/simulation/game.ts src/lib/simulation/triggers.ts
          git commit -m "experiment: add S16 nak at five percent"
          git push origin HEAD:experiment/s16
