name: migrate transition lifecycle once

on:
  push:
    branches:
      - refactor/canonical-v11
    paths:
      - 'archive/migrations/transition-lifecycle-once.py'
      - '.github/workflows/migrate-transition-lifecycle-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-v11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Apply transition lifecycle migration
        run: python archive/migrations/transition-lifecycle-once.py
      - name: Run runtime registry check
        run: node --import ./scripts/register-ts-hooks.mjs scripts/augment-runtime-registry-check.ts
      - name: Run canonical smoke
        run: bash scripts/run-s16-p10-smoke.sh
      - name: Run exact regressions
        run: node --import ./scripts/register-ts-hooks.mjs scripts/canonical-regression-seeds.ts
      - name: Commit canonical transition boundaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/simulation/game.ts
          git commit -m "refactor: route raw transitions through game lifecycle"
          git fetch origin refactor/canonical-v11
          git rebase origin/refactor/canonical-v11
          git push origin HEAD:refactor/canonical-v11
