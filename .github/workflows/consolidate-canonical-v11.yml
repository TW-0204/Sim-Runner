name: consolidate canonical v11 layout

on:
  push:
    branches:
      - refactor/canonical-v11

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-layout]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-v11
          fetch-depth: 0

      - name: Materialize simulation round-cap support
        run: python scripts/apply-simulation-round-cap.py

      - name: Archive legacy patch machinery and workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive/legacy-patches archive/legacy-workflows
          for f in scripts/apply-*.py; do
            [ -e "$f" ] || continue
            git mv "$f" archive/legacy-patches/
          done
          git mv scripts/run-balance-rework-v3.py archive/legacy-patches/
          git mv scripts/apply-v3-stack.sh archive/legacy-patches/

          for pattern in \
            '.github/workflows/apply-s16-nak.yml' \
            '.github/workflows/augment-rough-balance-v1-90k.yml' \
            '.github/workflows/augment-rough-balance-v1-smoke.yml' \
            '.github/workflows/augment-rough-balance-v2-smoke.yml' \
            '.github/workflows/balance-rework-v3-90k.yml' \
            '.github/workflows/balance-rework-v3-smoke.yml' \
            '.github/workflows/confirmed-balance-v1-quick.yml' \
            '.github/workflows/ideas-batch1-smoke.yml' \
            '.github/workflows/ideas-batch2-smoke.yml' \
            '.github/workflows/ideas-batch3-smoke.yml' \
            '.github/workflows/ideas-batch4-smoke.yml' \
            '.github/workflows/ideas-batch5-smoke.yml' \
            '.github/workflows/ideas-batch6-smoke.yml' \
            '.github/workflows/ideas-batch7-smoke.yml' \
            '.github/workflows/ideas-batch8-smoke.yml' \
            '.github/workflows/ideas-batch9-smoke.yml' \
            '.github/workflows/ideas-batch10-smoke.yml' \
            '.github/workflows/ideas-batch11-smoke.yml' \
            '.github/workflows/pretest-rough-tuning-smoke.yml' \
            '.github/workflows/stall-fixes-v4-smoke.yml' \
            '.github/workflows/stall-fixes-v5-diagnose.yml' \
            '.github/workflows/stall-fixes-v5-quick.yml' \
            '.github/workflows/stall-fixes-v8-smoke.yml'; do
            [ -e "$pattern" ] && git mv "$pattern" archive/legacy-workflows/
          done

      - name: Point active tooling at canonical source
        shell: python
        run: |
          from pathlib import Path
          import re

          for path in Path('.github/workflows').glob('*.yml'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'\n\s*- name: Apply current rule stack\n\s*run: bash scripts/apply-v3-stack\.sh\n',
                  '\n',
                  text,
              )
              text = re.sub(
                  r'\n\s*- name: Apply Round 30 draw cap\n\s*run: python scripts/apply-simulation-round-cap\.py\n',
                  '\n',
                  text,
              )
              text = '\n'.join(
                  line for line in text.splitlines()
                  if 'scripts/apply-v3-stack.sh' not in line
                  and 'scripts/apply-' not in line
                  and 'scripts/run-balance-rework-v3.py' not in line
              ) + '\n'
              path.write_text(text, encoding='utf-8')

          smoke = Path('scripts/run-s16-p10-smoke.sh')
          smoke_text = smoke.read_text(encoding='utf-8')
          smoke_text = smoke_text.replace('bash scripts/apply-v3-stack.sh\n\n', '')
          smoke_text = smoke_text.replace('S16 + P10 + v11 smoke PASS', 'Canonical v11 S16 + P10 smoke PASS')
          smoke.write_text(smoke_text, encoding='utf-8')

          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          old = '''## Augment source of truth

This repository uses a patch stack. Raw files such as `src/lib/augments/catalog.ts` may contain stale pre-patch values.

For the current effective rules, treat the state after:

```bash
bash scripts/apply-v3-stack.sh
```

as canonical.
'''
          new = '''## Augment source of truth

`src/` is the canonical source of truth for the current game and simulation behavior.

Do not apply legacy patch scripts before running tests or simulations. Historical patch machinery is preserved under `archive/legacy-patches/` for audit only and must not be used as an execution dependency.
'''
          if old not in text:
              raise SystemExit('AGENTS.md source-of-truth block not found')
          agents.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Add archive notes
        shell: bash
        run: |
          cat > archive/legacy-patches/README.md <<'EOF'
          # Legacy patch archive

          These files are the historical patch stack that produced the effective v11 behavior materialized from commit `dd0021d508a24586e55970b2461f3d5fe266e94f`.

          They are retained for audit and rollback archaeology only. Current CI, smoke tests, precision runs, and simulations must execute canonical `src/` directly.

          Do not add new `stall-fixes-v*.py` patches and do not restore these files to the runtime path.
          EOF

          cat > archive/legacy-workflows/README.md <<'EOF'
          # Legacy workflow archive

          These workflows belong to historical patch-stack experiments. They are outside `.github/workflows/` intentionally so they cannot execute.

          Current workflows must run against canonical `src/` without applying legacy patch scripts.
          EOF

      - name: Verify no active patch dependency remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'apply-v3-stack\.sh|python scripts/apply-[^ ]+\.py|python scripts/run-balance-rework-v3\.py' AGENTS.md .github/workflows scripts src; then
            echo 'Active patch dependency remains outside archive.' >&2
            exit 1
          fi

      - name: Remove one-shot migration workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/materialize-canonical-v11.yml
          git rm -f .github/workflows/consolidate-canonical-v11.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: retire patch stack and canonicalize simulation support [canonical-layout]"
          git push origin HEAD:refactor/canonical-v11
