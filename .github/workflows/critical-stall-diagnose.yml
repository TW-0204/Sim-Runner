name: Critical Stall Seed Diagnose

on:
  push:
    branches:
      - experiment/s16
    paths:
      - '.github/workflows/critical-stall-diagnose.yml'
      - 'scripts/critical-stall-diagnose.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Apply current rule stack
        run: bash scripts/apply-v3-stack.sh

      - name: Apply Round 30 draw cap
        run: python scripts/apply-simulation-round-cap.py

      - name: Reproduce critical stall seeds
        run: node --import ./scripts/register-ts-hooks.mjs scripts/critical-stall-diagnose.ts

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-stall-diagnostics
          path: critical-stall-diagnostics/
          if-no-files-found: error
          retention-days: 7
