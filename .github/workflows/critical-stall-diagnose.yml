name: Critical Stall Seed Diagnose

on:
  push:
    branches:
      - experiment/s16
      - refactor/canonical-v11
    paths:
      - '.github/workflows/critical-stall-diagnose.yml'
      - 'src/lib/augments/**'
      - 'src/lib/game/**'
      - 'src/lib/simulation/**'
      - 'scripts/critical-stall-diagnose.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Snapshot canonical sources
        run: |
          mkdir -p critical-stall-diagnostics/effective-source
          cp src/lib/simulation/game.ts critical-stall-diagnostics/effective-source/simulation-game.ts
          cp src/lib/game/engine.ts critical-stall-diagnostics/effective-source/engine.ts
          cp src/lib/game/passive-win.ts critical-stall-diagnostics/effective-source/passive-win.ts
          cp src/lib/game/augment-lifecycle.ts critical-stall-diagnostics/effective-source/augment-lifecycle.ts
          cp src/lib/game/invariants.ts critical-stall-diagnostics/effective-source/invariants.ts
          cp docs/augment-visual-manifest.md critical-stall-diagnostics/effective-source/augment-visual-manifest.md

      - name: Reproduce critical stall seeds
        run: node --import ./scripts/register-ts-hooks.mjs scripts/critical-stall-diagnose.ts

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-stall-diagnostics
          path: critical-stall-diagnostics/
          if-no-files-found: error
          retention-days: 7
