name: Canonical AUG-016 + AUG-037 Smoke

on:
  push:
    paths:
      - '.github/workflows/augment-016-037-smoke.yml'
      - 'src/lib/augments/**'
      - 'src/lib/game/**'
      - 'src/lib/simulation/**'
      - 'scripts/run-augment-016-037-smoke.sh'
      - 'scripts/augment-016-precision-run.ts'
      - 'scripts/augment-037-overpass-probe.ts'
      - 'scripts/stall-fixes-v10-probe.ts'
      - 'scripts/balance-rework-v3-probe.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Run canonical AUG-016 + AUG-037 smoke
        run: bash scripts/run-augment-016-037-smoke.sh
