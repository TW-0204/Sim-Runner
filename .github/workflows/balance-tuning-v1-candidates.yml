name: Balance Tuning V1 Candidates

on:
  push:
    branches:
      - balance/tuning-v1
    paths:
      - '.github/workflows/balance-tuning-v1-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'gaepan-slot1-unlock-6', augment: 'AUG-017', slot: 1, threshold: 6, games: 500 }
          - { label: 'gaepan-slot2-unlock-3', augment: 'AUG-017', slot: 2, threshold: 3, games: 500 }
          - { label: 'gaepan-slot2-unlock-4', augment: 'AUG-017', slot: 2, threshold: 4, games: 500 }
          - { label: 'gaepan-slot2-unlock-5', augment: 'AUG-017', slot: 2, threshold: 5, games: 500 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Apply acquisition-scoped Gaepan candidate inside runner only
        env:
          THRESHOLD: ${{ matrix.threshold }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          threshold = int(os.environ['THRESHOLD'])

          # Candidate rule:
          # - only GAE rolled after AUG-017 acquisition is counted
          # - before unlock, normal YUT/MO extra rolls remain intact
          # - the threshold-reaching GAE unlocks but grants no extra roll
          # - after unlock, each later GAE grants one extra roll and YUT/MO grant none
          p = Path('src/lib/augments/effects.ts')
          s = p.read_text()
          pattern = r'export function grantsFaceExtraRoll\(face: RollFace, ownedIds: string\[\]\) \{.*?\n\}\n\nexport function armA04OnAcquisition'
          replacement = f'''export function grantsFaceExtraRoll(face: RollFace, ownedIds: string[]) {{
            if (has(ownedIds, "AUG-017")) return face === "GAE";
            return face === "YUT" || face === "MO";
          }}

          export function canGrantFaceExtraRoll(
            engine: GameEngineState,
            userId: string,
            face: RollFace,
            ownedIds: string[],
          ) {{
            if (!has(ownedIds, "AUG-017")) return face === "YUT" || face === "MO";
            const countBeforeThisRoll = engine.augmentRuntime?.[userId]?.g01GameGaeCount ?? 0;
            if (face === "GAE") return countBeforeThisRoll + 1 > {threshold};
            if (face === "YUT" || face === "MO") return countBeforeThisRoll < {threshold};
            return false;
          }}

          export function consumeFaceExtraRollGrant(
            engine: GameEngineState,
            userId: string,
            face: RollFace,
            ownedIds: string[],
          ) {{
            if (!has(ownedIds, "AUG-017")) return face === "YUT" || face === "MO";

            const runtime = runtimeForPlayer(engine, userId);
            const countBeforeThisRoll = runtime.g01GameGaeCount ?? 0;

            if (face === "GAE") {{
              const countAfterThisRoll = countBeforeThisRoll + 1;
              runtime.g01GameGaeCount = countAfterThisRoll;

              if (countAfterThisRoll === {threshold} && runtime.g01UnlockRound == null) {{
                runtime.g01UnlockRound = engine.round;
                runtime.g01UnlockTurnNumber = engine.turnNumber;
              }}

              const grant = countAfterThisRoll > {threshold};
              if (grant) runtime.g01PostUnlockExtraRolls = (runtime.g01PostUnlockExtraRolls ?? 0) + 1;
              return grant;
            }}

            if (face === "YUT" || face === "MO") return countBeforeThisRoll < {threshold};
            return false;
          }}

          export function armA04OnAcquisition'''
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
            raise SystemExit('Gaepan face-extra block shape changed')
          p.write_text(s)

          # Candidate-only runtime telemetry.
          p = Path('src/lib/game/types.ts')
          s = p.read_text()
          marker = '  g01ExtraRollsGranted?: number;\n'
          if marker not in s:
            raise SystemExit('Gaepan runtime type marker missing')
          fields = '''  g01GameGaeCount?: number;
            g01UnlockRound?: number;
            g01UnlockTurnNumber?: number;
            g01PostUnlockExtraRolls?: number;
          '''
          s = s.replace(marker, marker + fields, 1)
          p.write_text(s)

          # Remove the legacy maximum-2 stacking restriction for this candidate.
          p = Path('src/lib/game/engine.ts')
          s = p.read_text()
          stack_guards = s.count('if (ownedIds.includes("AUG-017")) {')
          if stack_guards != 3:
            raise SystemExit(f'expected 3 Gaepan stack-limit guards, found {stack_guards}')
          s = s.replace('if (ownedIds.includes("AUG-017")) {', 'if (false && ownedIds.includes("AUG-017")) {')
          p.write_text(s)

          # Expose the direct candidate telemetry from every completed simulation.
          p = Path('src/lib/simulation/types.ts')
          s = p.read_text()
          marker = '  performanceByUser?: Record<string, PlayerPerformanceTelemetry>;\n'
          if marker not in s:
            raise SystemExit('Simulation result marker missing')
          telemetry_type = '''  gaepanCandidateTelemetryByUser?: Record<string, {
            gaeCount: number;
            unlockRound: number | null;
            unlockTurnNumber: number | null;
            postUnlockExtraRolls: number;
          }>;
          '''
          s = s.replace(marker, marker + telemetry_type, 1)
          p.write_text(s)

          p = Path('src/lib/simulation/game.ts')
          s = p.read_text()
          marker = '    performanceByUser: structuredClone(context.performanceByUser),\n'
          if marker not in s:
            raise SystemExit('Simulation return marker missing')
          telemetry_return = '''    gaepanCandidateTelemetryByUser: Object.fromEntries(context.engine.players.map((candidate) => {
              const runtime = context.engine.augmentRuntime?.[candidate.userId];
              return [candidate.userId, {
                gaeCount: runtime?.g01GameGaeCount ?? 0,
                unlockRound: runtime?.g01UnlockRound ?? null,
                unlockTurnNumber: runtime?.g01UnlockTurnNumber ?? null,
                postUnlockExtraRolls: runtime?.g01PostUnlockExtraRolls ?? 0,
              }];
            })),
          '''
          s = s.replace(marker, marker + telemetry_return, 1)
          p.write_text(s)

          # Make the paired diagnostic slot-selectable and report unlock telemetry.
          p = Path('scripts/augment-diagnostic-run.ts')
          s = p.read_text()
          old = '''const maxRounds = positiveInteger("max-rounds", argument("max-rounds"), 60);
          const outputDir = argument("output-dir") ?? "augment-diagnostic-results";'''
          new = '''const maxRounds = positiveInteger("max-rounds", argument("max-rounds"), 60);
          const requestedAcquisitionIndex = argument("acquisition-index") == null
            ? null
            : positiveInteger("acquisition-index", argument("acquisition-index"), 1);
          const outputDir = argument("output-dir") ?? "augment-diagnostic-results";'''
          if old not in s:
            raise SystemExit('diagnostic arg marker changed')
          s = s.replace(old, new, 1)

          old = '''const acquisitionIndexes = target.timing === "last" ? [2]
            : target.timing === "first" || target.timing === "not-last" ? [1]
            : [1, 2];'''
          new = '''const defaultAcquisitionIndexes = target.timing === "last" ? [2]
            : target.timing === "first" || target.timing === "not-last" ? [1]
            : [1, 2];
          const acquisitionIndexes = requestedAcquisitionIndex == null
            ? defaultAcquisitionIndexes
            : [requestedAcquisitionIndex];'''
          if old not in s:
            raise SystemExit('diagnostic acquisition index marker changed')
          s = s.replace(old, new, 1)

          old = '    let triggerSum = 0;\n'
          new = '''    let triggerSum = 0;
              let unlockedGames = 0;
              let unlockRoundSum = 0;
              let unlockTurnNumberSum = 0;
              let postUnlockExtraRollSum = 0;
          '''
          if old not in s:
            raise SystemExit('diagnostic counter marker changed')
          s = s.replace(old, new, 1)

          old = '''      if (treatmentWon) triggerBuckets[bucket].wins += 1;

                addPerf(treatmentPerf, treatment.performanceByUser?.[forcedUserId]);'''
          new = '''      if (treatmentWon) triggerBuckets[bucket].wins += 1;

                const gaepanTelemetry = (treatment as any).gaepanCandidateTelemetryByUser?.[forcedUserId];
                if (gaepanTelemetry?.unlockRound != null) {
                  unlockedGames += 1;
                  unlockRoundSum += gaepanTelemetry.unlockRound;
                  unlockTurnNumberSum += gaepanTelemetry.unlockTurnNumber ?? 0;
                }
                postUnlockExtraRollSum += gaepanTelemetry?.postUnlockExtraRolls ?? 0;

                addPerf(treatmentPerf, treatment.performanceByUser?.[forcedUserId]);'''
          if old not in s:
            raise SystemExit('diagnostic telemetry marker changed')
          s = s.replace(old, new, 1)

          old = '      averageTriggers: triggerSum / validPairs,\n'
          new = '''      averageTriggers: triggerSum / validPairs,
                unlockRate: unlockedGames / validPairs,
                averageUnlockRound: unlockedGames ? unlockRoundSum / unlockedGames : null,
                averageUnlockTurnNumber: unlockedGames ? unlockTurnNumberSum / unlockedGames : null,
                averagePostUnlockExtraRollsPerGame: postUnlockExtraRollSum / validPairs,
                averagePostUnlockExtraRollsWhenUnlocked: unlockedGames ? postUnlockExtraRollSum / unlockedGames : null,
          '''
          if old not in s:
            raise SystemExit('diagnostic report marker changed')
          s = s.replace(old, new, 1)

          old = '  "| Slot | Players | Treatment win | Control same-seat win | Paired delta | >15R T/C | >20R T/C | Avg triggers | Capture Δ | Lost-piece Δ | Finish Δ |",\n  "|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|",'
          new = '  "| Slot | Players | Treatment win | Control same-seat win | Paired delta | Unlock rate | Avg unlock R | Extra rolls/game | Extra rolls/unlocked | >15R T/C | >20R T/C |",\n  "|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|",'
          if old not in s:
            raise SystemExit('diagnostic markdown header marker changed')
          s = s.replace(old, new, 1)

          old = '''    return `| ${r.acquisitionIndex} | ${r.playerCount} | ${pct(r.treatmentWinRate)} | ${pct(r.controlWinRate)} | ${r.pairedWinDeltaPp >= 0 ? "+" : ""}${r.pairedWinDeltaPp.toFixed(2)}%p | ${pct(r.treatmentOver15Rate)} / ${pct(r.controlOver15Rate)} | ${pct(r.treatmentOver20Rate)} / ${pct(r.controlOver20Rate)} | ${r.averageTriggers.toFixed(2)} | ${r.performanceDelta.enemyPiecesCaptured.toFixed(2)} | ${r.performanceDelta.ownPiecesSentToWaiting.toFixed(2)} | ${r.performanceDelta.piecesFinished.toFixed(2)} |`;'''
          new = '''    return `| ${r.acquisitionIndex} | ${r.playerCount} | ${pct(r.treatmentWinRate)} | ${pct(r.controlWinRate)} | ${r.pairedWinDeltaPp >= 0 ? "+" : ""}${r.pairedWinDeltaPp.toFixed(2)}%p | ${pct(r.unlockRate)} | ${r.averageUnlockRound == null ? "—" : r.averageUnlockRound.toFixed(2)} | ${r.averagePostUnlockExtraRollsPerGame.toFixed(2)} | ${r.averagePostUnlockExtraRollsWhenUnlocked == null ? "—" : r.averagePostUnlockExtraRollsWhenUnlocked.toFixed(2)} | ${pct(r.treatmentOver15Rate)} / ${pct(r.controlOver15Rate)} | ${pct(r.treatmentOver20Rate)} / ${pct(r.controlOver20Rate)} |`;'''
          if old not in s:
            raise SystemExit('diagnostic markdown row marker changed')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          git diff -- src/lib/augments/effects.ts src/lib/game/engine.ts src/lib/game/types.ts src/lib/simulation/game.ts src/lib/simulation/types.ts scripts/augment-diagnostic-run.ts

      - name: Run paired candidate diagnostic
        run: |
          OUT="tuning-results/${{ matrix.label }}"
          node --import ./scripts/register-ts-hooks.mjs scripts/augment-diagnostic-run.ts \
            --augment "${{ matrix.augment }}" \
            --acquisition-index "${{ matrix.slot }}" \
            --games "${{ matrix.games }}" \
            --max-rounds 60 \
            --output-dir "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tuning-${{ matrix.label }}
          path: tuning-results/
          if-no-files-found: error
          retention-days: 14
