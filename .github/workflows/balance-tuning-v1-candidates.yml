name: Balance Tuning V1 Candidates

on:
  push:
    branches:
      - balance/tuning-v1
    paths:
      - '.github/workflows/balance-tuning-v1-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'baseline-gaepan', augment: 'AUG-017', patch: 'baseline' }
          - { label: 'gaepan-unlock-6', augment: 'AUG-017', patch: 'gaepan-unlock-6' }
          - { label: 'gaepan-unlock-7', augment: 'AUG-017', patch: 'gaepan-unlock-7' }
          - { label: 'gaepan-unlock-8', augment: 'AUG-017', patch: 'gaepan-unlock-8' }
          - { label: 'baseline-godhand', augment: 'AUG-044', patch: 'baseline' }
          - { label: 'godhand-next-1', augment: 'AUG-044', patch: 'godhand-next-1' }
          - { label: 'godhand-next-2', augment: 'AUG-044', patch: 'godhand-next-2' }
          - { label: 'godhand-next-3', augment: 'AUG-044', patch: 'godhand-next-3' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Apply candidate patch inside runner only
        if: matrix.patch != 'baseline'
        env:
          PATCH: ${{ matrix.patch }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          patch = os.environ['PATCH']

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {patch}, found {count}')
              p.write_text(s.replace(old, new))

          if patch.startswith('godhand-next-'):
              uses = int(patch.removeprefix('godhand-next-'))
              p = Path('src/lib/game/roll-flow.ts')
              s = p.read_text()

              old_charge = '''export function godHandChargeCount(engine: GameEngineState, userId: string, ownedIds: string[]) {\n  if (!has(ownedIds, "AUG-044")) return 0;\n  return engine.augmentRuntime?.[userId]?.godHandCharges ?? 0;\n}'''
              new_charge = f'''export function godHandChargeCount(engine: GameEngineState, userId: string, ownedIds: string[]) {{\n  if (!has(ownedIds, "AUG-044")) return 0;\n  const runtime = runtimeFor(engine, userId);\n  if (runtime.godHandCharges == null) runtime.godHandCharges = {uses};\n  return runtime.godHandCharges;\n}}'''
              if s.count(old_charge) != 1:
                  raise SystemExit('godHandChargeCount shape changed')
              s = s.replace(old_charge, new_charge)

              s, count = re.subn(
                  r'function recordGodHandBasicRoll\(engine: GameEngineState, userId: string, ownedIds: string\[\]\) \{.*?\n\}\n\nfunction canUseDoReroll',
                  '''function recordGodHandBasicRoll(engine: GameEngineState, userId: string, ownedIds: string[]) {\n  // Finite-use God Hand does not recharge from later basic rolls.\n  if (!has(ownedIds, "AUG-044")) return;\n}\n\nfunction canUseDoReroll''',
                  s,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit('recordGodHandBasicRoll shape changed')

              old_spend = '''  runtime.godHandCharges ??= 0;\n  runtime.godHandBasicProgress ??= 0;\n  if (runtime.godHandCharges < 1) throw new Error("신의 손 충전이 없습니다.");\n  runtime.godHandCharges -= 1;\n  runtime.godHandBasicProgress = 0;\n  runtime.godHandSkipNextBasicProgress = true;'''
              new_spend = f'''  if (runtime.godHandCharges == null) runtime.godHandCharges = {uses};\n  if (runtime.godHandCharges < 1) throw new Error("신의 손 사용 횟수가 없습니다.");\n  runtime.godHandCharges -= 1;'''
              if s.count(old_spend) != 1:
                  raise SystemExit('God Hand spend block shape changed')
              s = s.replace(old_spend, new_spend)
              p.write_text(s)

          elif patch.startswith('gaepan-unlock-'):
              threshold = int(patch.removeprefix('gaepan-unlock-'))
              p = Path('src/lib/augments/effects.ts')
              s = p.read_text()
              pattern = r'export function grantsFaceExtraRoll\(face: RollFace, ownedIds: string\[\]\) \{.*?\n\}\n\nexport function armA04OnAcquisition'
              replacement = f'''export function grantsFaceExtraRoll(face: RollFace, ownedIds: string[]) {{\n  if (has(ownedIds, "AUG-017")) return face === "GAE";\n  return face === "YUT" || face === "MO";\n}}\n\nexport function canGrantFaceExtraRoll(\n  engine: GameEngineState,\n  userId: string,\n  face: RollFace,\n  ownedIds: string[],\n) {{\n  if (!has(ownedIds, "AUG-017")) return face === "YUT" || face === "MO";\n  if (face !== "GAE") return false;\n  const countBeforeThisRoll = engine.augmentRuntime?.[userId]?.g01GameGaeCount ?? 0;\n  return countBeforeThisRoll + 1 > {threshold};\n}}\n\nexport function consumeFaceExtraRollGrant(\n  engine: GameEngineState,\n  userId: string,\n  face: RollFace,\n  ownedIds: string[],\n) {{\n  const grant = canGrantFaceExtraRoll(engine, userId, face, ownedIds);\n  const runtime = runtimeForPlayer(engine, userId);\n  if (face === "GAE") runtime.g01GameGaeCount = (runtime.g01GameGaeCount ?? 0) + 1;\n  return grant;\n}}\n\nexport function armA04OnAcquisition'''
              s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('G01 face-extra block shape changed')
              p.write_text(s)

              p = Path('src/lib/game/types.ts')
              s = p.read_text()
              marker = '  g01ExtraRollsGranted?: number;\n'
              if marker not in s:
                  raise SystemExit('G01 runtime type marker missing')
              s = s.replace(marker, marker + '  g01GameGaeCount?: number;\n', 1)
              p.write_text(s)

              p = Path('src/lib/game/engine.ts')
              s = p.read_text()
              count = s.count('if (ownedIds.includes("AUG-017")) {')
              if count != 3:
                  raise SystemExit(f'expected 3 G01 stack-limit guards, found {count}')
              s = s.replace('if (ownedIds.includes("AUG-017")) {', 'if (false && ownedIds.includes("AUG-017")) {')
              p.write_text(s)
          else:
              raise SystemExit(f'unknown patch: {patch}')
          PY
          git diff --check
          git diff -- src/lib/augments/effects.ts src/lib/game/engine.ts src/lib/game/roll-flow.ts src/lib/game/types.ts
      - name: Run paired candidate diagnostic
        run: |
          OUT="tuning-results/${{ matrix.label }}"
          node --import ./scripts/register-ts-hooks.mjs scripts/augment-diagnostic-run.ts \
            --augment "${{ matrix.augment }}" \
            --games 200 \
            --max-rounds 60 \
            --output-dir "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tuning-${{ matrix.label }}
          path: tuning-results/
          if-no-files-found: error
          retention-days: 14

  compare:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tuning-*
          path: tuning-results
          merge-multiple: true
      - name: Build comparison table
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const groups = {
            'AUG-017': ['baseline-gaepan','gaepan-unlock-6','gaepan-unlock-7','gaepan-unlock-8'],
            'AUG-044': ['baseline-godhand','godhand-next-1','godhand-next-2','godhand-next-3'],
          };
          const rows = [];
          for (const [augment, labels] of Object.entries(groups)) {
            for (const label of labels) {
              const file = path.join('tuning-results', label, `diagnostic-${augment}.json`);
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              for (const r of report.reports) {
                rows.push({
                  augment,
                  name: report.name,
                  label,
                  slot: r.acquisitionIndex,
                  players: r.playerCount,
                  pairedDeltaPp: r.pairedWinDeltaPp,
                  treatmentWinRate: r.treatmentWinRate,
                  controlWinRate: r.controlWinRate,
                  treatmentAverageRound: r.treatmentAverageRound,
                  controlAverageRound: r.controlAverageRound,
                  triggerRate: r.triggerRate,
                  averageTriggers: r.averageTriggers,
                  performanceDelta: r.performanceDelta,
                });
              }
            }
          }
          fs.writeFileSync('tuning-comparison.json', JSON.stringify(rows, null, 2));
          console.log('| Augment | Candidate | Slot | P | Paired Δ | Treatment win | Control win | Avg round T/C |');
          console.log('|---|---|---:|---:|---:|---:|---:|---:|');
          for (const r of rows) {
            const pp = n => `${n >= 0 ? '+' : ''}${n.toFixed(2)}%p`;
            const pct = n => `${(n*100).toFixed(1)}%`;
            console.log(`| ${r.augment} ${r.name} | ${r.label} | ${r.slot} | ${r.players} | ${pp(r.pairedDeltaPp)} | ${pct(r.treatmentWinRate)} | ${pct(r.controlWinRate)} | ${r.treatmentAverageRound.toFixed(2)}/${r.controlAverageRound.toFixed(2)} |`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: tuning-v1-comparison
          path: tuning-comparison.json
          if-no-files-found: error
          retention-days: 14
