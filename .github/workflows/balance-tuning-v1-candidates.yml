name: Balance Tuning V1 Candidates

on:
  push:
    branches:
      - balance/tuning-v1
    paths:
      - '.github/workflows/balance-tuning-v1-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'godhand-next-3-smart-face-trace', augment: 'AUG-044', uses: 3, games: 500 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Apply finite God Hand smart policy with face telemetry inside runner only
        env:
          USES: ${{ matrix.uses }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          uses = int(os.environ['USES'])

          # Finite-use candidate: acquisition grants N basic-roll overrides, no recharge.
          p = Path('src/lib/game/roll-flow.ts')
          s = p.read_text()
          old_charge = '''export function godHandChargeCount(engine: GameEngineState, userId: string, ownedIds: string[]) {
            if (!has(ownedIds, "AUG-044")) return 0;
            return engine.augmentRuntime?.[userId]?.godHandCharges ?? 0;
          }'''
          new_charge = f'''export function godHandChargeCount(engine: GameEngineState, userId: string, ownedIds: string[]) {{
            if (!has(ownedIds, "AUG-044")) return 0;
            const runtime = runtimeFor(engine, userId);
            if (runtime.godHandCharges == null) runtime.godHandCharges = {uses};
            return runtime.godHandCharges;
          }}'''
          if s.count(old_charge) != 1:
            raise SystemExit('godHandChargeCount shape changed')
          s = s.replace(old_charge, new_charge)

          s, count = re.subn(
              r'function recordGodHandBasicRoll\(engine: GameEngineState, userId: string, ownedIds: string\[\]\) \{.*?\n\}\n\nfunction canUseDoReroll',
              '''function recordGodHandBasicRoll(engine: GameEngineState, userId: string, ownedIds: string[]) {
            // Finite-use God Hand does not recharge from later basic rolls.
            if (!has(ownedIds, "AUG-044")) return;
          }

          function canUseDoReroll''',
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
            raise SystemExit('recordGodHandBasicRoll shape changed')

          old_spend = '''  runtime.godHandCharges ??= 0;
            runtime.godHandBasicProgress ??= 0;
            if (runtime.godHandCharges < 1) throw new Error("신의 손 충전이 없습니다.");
            runtime.godHandCharges -= 1;
            runtime.godHandBasicProgress = 0;
            runtime.godHandSkipNextBasicProgress = true;'''
          new_spend = f'''  if (runtime.godHandCharges == null) runtime.godHandCharges = {uses};
            if (runtime.godHandCharges < 1) throw new Error("신의 손 사용 횟수가 없습니다.");
            runtime.godHandCharges -= 1;'''
          if s.count(old_spend) != 1:
            raise SystemExit('God Hand spend block shape changed')
          s = s.replace(old_spend, new_spend)
          p.write_text(s)

          # Expose selected-face telemetry on simulation results.
          p = Path('src/lib/simulation/types.ts')
          s = p.read_text()
          marker = '  performanceByUser?: Record<string, PlayerPerformanceTelemetry>;\n'
          if marker not in s:
            raise SystemExit('simulation result marker missing')
          s = s.replace(marker, marker + '  godHandSmartFaceCountsByUser?: Record<string, Record<string, number>>;\n', 1)
          p.write_text(s)

          # Bot-only policy: evaluate all five selectable faces against the current board.
          p = Path('src/lib/simulation/game.ts')
          s = p.read_text()
          old_import = '''import {
            godHandChargeCount,
            keepDoResult,
            resolveDualRollChoice,
          } from "@/lib/game/roll-flow";'''
          new_import = '''import {
            applyGodHandRoll,
            godHandChargeCount,
            keepDoResult,
            resolveDualRollChoice,
          } from "@/lib/game/roll-flow";'''
          if s.count(old_import) != 1:
            raise SystemExit('roll-flow import shape changed')
          s = s.replace(old_import, new_import)

          old_type_import = 'import type { GameEngineState, PieceState, RollToken } from "@/lib/game/types";'
          new_type_import = 'import type { GameEngineState, PieceState, RollFace, RollToken } from "@/lib/game/types";'
          if s.count(old_type_import) != 1:
            raise SystemExit('game type import shape changed')
          s = s.replace(old_type_import, new_type_import)

          context_marker = '  performanceByUser: Record<string, { rolls: number; moves: number; enemyPiecesCaptured: number; ownPiecesSentToWaiting: number; piecesFinished: number }>;\n'
          if context_marker not in s:
            raise SystemExit('simulation context marker missing')
          s = s.replace(context_marker, context_marker + '  godHandSmartFaceCountsByUser: Record<string, Record<string, number>>;\n', 1)

          old_execute = '''function executeRoll(context: SimulationContext, engine: GameEngineState, userId: string) {
            const owned = actorOwned(context, userId);
            const godHandFace = engine.pendingRolls[0] === "BASIC"
              && owned.includes("AUG-044")
              && godHandChargeCount(engine, userId, owned) > 0
                ? "MO" as const
                : null;

            const result = executeRollLifecycle({'''
          new_execute = '''const GOD_HAND_SMART_FACES: RollFace[] = ["MO", "YUT", "GEOL", "GAE", "DO"];

          function godHandPreviewScore(
            context: SimulationContext,
            engine: GameEngineState,
            userId: string,
            face: RollFace,
          ) {
            const owned = actorOwned(context, userId);
            const setups = actorSetups(context, userId);
            try {
              const preview = applyGodHandRoll(
                engine,
                face,
                `god-hand-preview:${face}`,
                owned,
                setups,
              );
              const queuedRollValue = preview.pendingRolls.length * 12;
              const movementPreview = structuredClone(preview);
              if (movementPreview.stage === "AWAITING_ROLL" && movementPreview.results.length > 0) {
                movementPreview.pendingRolls = [];
                movementPreview.stage = "MOVING";
              }

              let bestScore = playerPositionScore(movementPreview, userId, owned, setups);
              if (movementPreview.stage === "MOVING") {
                const moveOwned = moveOwnedIdsForAthlete(owned);
                const legalOptions = legalMoveOptionsWithAugments(
                  movementPreview,
                  userId,
                  owned,
                  setups,
                  context.ownedByUser,
                  moveOwned,
                );
                for (const option of legalOptions) {
                  try {
                    const next = executeMoveAction(
                      context,
                      movementPreview,
                      userId,
                      moveArgsForTarget(
                        option.groupId,
                        option.result,
                        option.target,
                        owned.includes("AUG-031"),
                      ),
                    );
                    bestScore = Math.max(bestScore, outcomeScore(context, movementPreview, next, userId));
                  } catch {
                    // Ignore invalid preview moves exactly as the normal bot scorer does.
                  }
                }
              }
              return bestScore + queuedRollValue;
            } catch {
              return Number.NEGATIVE_INFINITY;
            }
          }

          function chooseSmartGodHandFace(
            context: SimulationContext,
            engine: GameEngineState,
            userId: string,
          ): RollFace {
            let bestFace: RollFace = "MO";
            let bestScore = Number.NEGATIVE_INFINITY;
            for (const face of GOD_HAND_SMART_FACES) {
              const score = godHandPreviewScore(context, engine, userId, face);
              if (score > bestScore) {
                bestScore = score;
                bestFace = face;
              }
            }
            return bestFace;
          }

          function executeRoll(context: SimulationContext, engine: GameEngineState, userId: string) {
            const owned = actorOwned(context, userId);
            let godHandFace: RollFace | null = null;
            if (
              engine.pendingRolls[0] === "BASIC"
              && owned.includes("AUG-044")
              && godHandChargeCount(engine, userId, owned) > 0
            ) {
              godHandFace = chooseSmartGodHandFace(context, engine, userId);
              const counts = context.godHandSmartFaceCountsByUser[userId] ?? (context.godHandSmartFaceCountsByUser[userId] = {});
              counts[godHandFace] = (counts[godHandFace] ?? 0) + 1;
            }

            const result = executeRollLifecycle({'''
          if s.count(old_execute) != 1:
            raise SystemExit('executeRoll God Hand policy shape changed')
          s = s.replace(old_execute, new_execute)

          init_marker = '    performanceByUser: Object.fromEntries(engine.players.map((player) => [player.userId, { rolls: 0, moves: 0, enemyPiecesCaptured: 0, ownPiecesSentToWaiting: 0, piecesFinished: 0 }])),\n'
          if init_marker not in s:
            raise SystemExit('simulation context init marker missing')
          s = s.replace(init_marker, init_marker + '    godHandSmartFaceCountsByUser: Object.fromEntries(engine.players.map((player) => [player.userId, {}])),\n', 1)

          return_marker = '    performanceByUser: structuredClone(context.performanceByUser),\n'
          if return_marker not in s:
            raise SystemExit('simulation return marker missing')
          s = s.replace(return_marker, return_marker + '    godHandSmartFaceCountsByUser: structuredClone(context.godHandSmartFaceCountsByUser),\n', 1)
          p.write_text(s)

          # Aggregate selected faces in the paired diagnostic JSON.
          p = Path('scripts/augment-diagnostic-run.ts')
          s = p.read_text()
          counter_marker = '    let triggerSum = 0;\n'
          if counter_marker not in s:
            raise SystemExit('diagnostic counter marker missing')
          s = s.replace(counter_marker, counter_marker + '    const godHandFaceCounts: Record<string, number> = { DO: 0, GAE: 0, GEOL: 0, YUT: 0, MO: 0 };\n', 1)

          perf_marker = '''      addPerf(treatmentPerf, treatment.performanceByUser?.[forcedUserId]);
                addPerf(controlPerf, control.performanceByUser?.[forcedUserId]);'''
          telemetry = '''      const selectedFaces = (treatment as any).godHandSmartFaceCountsByUser?.[forcedUserId] ?? {};
                for (const face of ["DO", "GAE", "GEOL", "YUT", "MO"]) {
                  godHandFaceCounts[face] += selectedFaces[face] ?? 0;
                }

                addPerf(treatmentPerf, treatment.performanceByUser?.[forcedUserId]);
                addPerf(controlPerf, control.performanceByUser?.[forcedUserId]);'''
          if perf_marker not in s:
            raise SystemExit('diagnostic perf marker missing')
          s = s.replace(perf_marker, telemetry, 1)

          report_marker = '      averageTriggers: triggerSum / validPairs,\n'
          if report_marker not in s:
            raise SystemExit('diagnostic report marker missing')
          s = s.replace(report_marker, report_marker + '      godHandFaceCounts,\n', 1)
          p.write_text(s)
          PY

          git diff --check
          git diff -- src/lib/game/roll-flow.ts src/lib/simulation/game.ts src/lib/simulation/types.ts scripts/augment-diagnostic-run.ts

      - name: Run paired candidate diagnostic
        run: |
          OUT="tuning-results/${{ matrix.label }}"
          node --import ./scripts/register-ts-hooks.mjs scripts/augment-diagnostic-run.ts \
            --augment "${{ matrix.augment }}" \
            --games "${{ matrix.games }}" \
            --max-rounds 60 \
            --output-dir "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tuning-${{ matrix.label }}
          path: tuning-results/
          if-no-files-found: error
          retention-days: 14
