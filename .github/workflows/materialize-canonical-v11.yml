name: materialize canonical v11

on:
  push:
    branches:
      - refactor/canonical-v11

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-v11]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-v11
          fetch-depth: 0

      - name: Materialize effective v11 source
        run: bash scripts/apply-v3-stack.sh

      - name: Show generated diff
        run: |
          git status --short
          git diff --stat

      - name: Commit canonical src
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No src changes to materialize"
            exit 0
          fi
          git commit -m "refactor: materialize effective v11 source [materialized-v11]"
          git push origin HEAD:refactor/canonical-v11
