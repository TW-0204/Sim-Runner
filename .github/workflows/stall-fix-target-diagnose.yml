name: Stall Fix Target Diagnose

on:
  push:
    branches: [experiment/s16]
    paths:
      - '.github/workflows/stall-fix-target-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Apply current v3 rules
        run: bash scripts/apply-v3-stack.sh
      - name: Diagnose known stalls
        run: |
          node --import ./scripts/register-ts-hooks.mjs --input-type=module <<'NODE'
          import { getBalanceRuleset } from './src/lib/simulation/rulesets.ts';
          import { simulateGame } from './src/lib/simulation/game.ts';

          const ruleset = getBalanceRuleset('two-aug-start-r4-special-slots-v2');
          const targets = [
            { playerCount: 2, seed: '823002', label: 'A16-simple' },
            { playerCount: 2, seed: '801756', label: 'A16-G13' },
            { playerCount: 3, seed: '900238', label: 'A16-3p' },
            { playerCount: 2, seed: '800912', label: 'G01-P11' },
          ];

          for (const target of targets) {
            const result = simulateGame({
              seed: target.seed,
              ruleset,
              playerCount: target.playerCount,
              maxActions: 20_000,
            });
            const engine = result.failureDiagnostics?.engine;
            console.log(JSON.stringify({
              ...target,
              status: result.status,
              error: result.error,
              round: result.round,
              turnNumber: result.turnNumber,
              acquisitions: result.acquisitions,
              ownedByUser: result.failureDiagnostics?.ownedByUser,
              stage: engine?.stage,
              currentSeat: engine?.currentSeat,
              pendingRolls: engine?.pendingRolls,
              results: engine?.results,
              augmentRuntime: engine?.augmentRuntime,
              players: engine?.players.map((player) => ({
                userId: player.userId,
                pieces: player.pieces,
              })),
            }));
          }
          NODE
