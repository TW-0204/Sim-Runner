name: Stall Fix V8 Known Seeds

on:
  workflow_dispatch:
  push:
    branches: [experiment/s16]
    paths:
      - '.github/workflows/stall-fixes-v5-quick.yml'

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Apply current v3 plus stall fixes
        run: bash scripts/apply-v3-stack.sh
      - name: Recheck all 13 known stall seeds
        run: |
          node --import ./scripts/register-ts-hooks.mjs --input-type=module <<'NODE'
          import { getBalanceRuleset } from './src/lib/simulation/rulesets.ts';
          import { simulateGame } from './src/lib/simulation/game.ts';
          const ruleset = getBalanceRuleset('two-aug-start-r4-special-slots-v2');
          const cases = [
            { seed: '1301484', playerCount: 2, label: 'A10-terminal-1' },
            { seed: '1301794', playerCount: 2, label: 'A10-terminal-2' },
            { seed: '1400473', playerCount: 3, label: 'P14-A13-wormhole-lap' },
            { seed: '1402130', playerCount: 3, label: 'A10-selection-invalidated' },
            { seed: '1500013', playerCount: 4, label: 'P14-A08-upheaval-lap' },
            { seed: '1500032', playerCount: 4, label: 'A15-only-piece-locked' },
            { seed: '1500206', playerCount: 4, label: 'A16-center-shortened-route' },
            { seed: '1500642', playerCount: 4, label: 'A10-terminal-4p' },
            { seed: '1501086', playerCount: 4, label: 'A10-invalidated-1' },
            { seed: '1501172', playerCount: 4, label: 'P14-A13-wormhole-lap-4p' },
            { seed: '1501188', playerCount: 4, label: 'A10-invalidated-2' },
            { seed: '1501304', playerCount: 4, label: 'A10-invalidated-3' },
            { seed: '1501995', playerCount: 4, label: 'A13-G13-backdo' },
          ];
          let bad = 0;
          for (const item of cases) {
            const result = simulateGame({ seed: item.seed, ruleset, playerCount: item.playerCount, maxActions: 20000 });
            console.log(JSON.stringify({ ...item, status: result.status, winnerUserId: result.winnerUserId, winnerCondition: result.winnerCondition, error: result.error }));
            if (result.status !== 'COMPLETED') bad += 1;
          }
          if (bad > 0) throw new Error(`${bad}/${cases.length} known stall seeds did not complete`);
          NODE
