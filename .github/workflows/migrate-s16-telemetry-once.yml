name: migrate S16 telemetry once

on:
  push:
    branches:
      - refactor/canonical-v11
    paths:
      - 'archive/migrations/migrate-s16-telemetry-once.py'
      - '.github/workflows/migrate-s16-telemetry-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-v11
          fetch-depth: 0
      - name: Materialize S16 telemetry
        run: python archive/migrations/migrate-s16-telemetry-once.py
      - name: Commit S16 observability refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/simulation/game.ts src/lib/simulation/types.ts scripts/s16-precision-run.ts
          git commit -m "refactor: materialize S16 telemetry without source injection"
          git push origin HEAD:refactor/canonical-v11
