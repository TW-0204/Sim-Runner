name: AUG-033 Bottleneck Diagnostic

on:
  push:
    paths:
      - '.github/workflows/augment-033-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Run AUG-033 diagnostic
        run: node --import ./scripts/register-ts-hooks.mjs scripts/augment-033-diagnostic-run.ts --games 1000
