name: Apply approved P16 thresholds

on:
  push:
    paths:
      - '.github/workflows/apply-p16-7-16-22.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Patch P16 to 7/16/22
        run: |
          python - <<'PY'
          from pathlib import Path

          effects = Path('src/lib/augments/effects.ts')
          text = effects.read_text()
          old = '''export function huntCaptureTarget(playerCount: number) {
            return 4 + playerCount;
          }'''
          new = '''export function huntCaptureTarget(playerCount: number) {
            if (playerCount === 2) return 7;
            if (playerCount === 3) return 16;
            if (playerCount === 4) return 22;
            return 22;
          }'''
          if old not in text:
              raise SystemExit('huntCaptureTarget block not found')
          effects.write_text(text.replace(old, new))

          catalog = Path('src/lib/augments/catalog.ts')
          text = catalog.read_text()
          old_desc = '기본 승리 조건 대신 상대 말 잡기를 2인 6회, 3인 7회, 4인 8회 달성하면 즉시 승리합니다.'
          new_desc = '기본 승리 조건 대신 상대 말 잡기를 2인 7회, 3인 16회, 4인 22회 달성하면 즉시 승리합니다.'
          if old_desc not in text:
              raise SystemExit('P16 catalog description not found')
          catalog.write_text(text.replace(old_desc, new_desc))
          PY

      - name: Commit approved rule
        run: |
          git config user.name "TW-0204"
          git config user.email "leetwoong0204@gmail.com"
          git add src/lib/augments/effects.ts src/lib/augments/catalog.ts
          git commit -m "balance: set P16 hunt targets to 7/16/22"
          git push
