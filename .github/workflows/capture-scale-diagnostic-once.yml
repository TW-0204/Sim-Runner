name: Capture Scale Diagnostic Once

on:
  push:
    branches:
      - balance/diagnostics-v1
    paths:
      - '.github/workflows/capture-scale-diagnostic-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { players: 3, capture: 42.5 }
          - { players: 4, capture: 28.3333333333 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Apply scaled capture utility in runner only
        env:
          CAPTURE_REWARD: ${{ matrix.capture }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/lib/simulation/game.ts')
          text = path.read_text()
          old = 'return base + capturedEnemyPieceCount(before, after, userId) * 85;'
          new = f"return base + capturedEnemyPieceCount(before, after, userId) * {os.environ['CAPTURE_REWARD']};"
          if text.count(old) != 1:
              raise SystemExit(f'capture score anchor count was {text.count(old)}, expected 1')
          path.write_text(text.replace(old, new))
          PY
      - name: Run scaled capture duration audit
        env:
          PLAYERS: ${{ matrix.players }}
          CAPTURE_REWARD: ${{ matrix.capture }}
        run: |
          SEED_START=$((1200000 + PLAYERS * 100000))
          node --import ./scripts/register-ts-hooks.mjs scripts/bot-policy-duration-audit.ts \
            --label "capture-scaled" \
            --player-count "$PLAYERS" \
            --games 2000 \
            --seed-start "$SEED_START" \
            --max-rounds 100 \
            --capture-reward "$CAPTURE_REWARD" \
            --onboard-base 45 \
            --output-dir capture-scale-results
      - uses: actions/upload-artifact@v4
        with:
          name: capture-scale-${{ matrix.players }}p
          path: capture-scale-results/
          if-no-files-found: error
          retention-days: 7
