name: Migrate Augment IDs V2 Once

on:
  push:
    branches:
      - refactor/augment-id-v2
    paths:
      - 'archive/migrations/migrate-augment-ids-v2.py'
      - '.github/workflows/migrate-augment-ids-v2-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/augment-id-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Migrate canonical augment identities
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/if path == LEGACY_MAP_PATH:/if path in {LEGACY_MAP_PATH, DOC_PATH}:/' archive/migrations/migrate-augment-ids-v2.py
          sed -i 's/Historical inactive A03 identity/Historical inactive identity/' archive/migrations/migrate-augment-ids-v2.py
          python archive/migrations/migrate-augment-ids-v2.py

      - name: Verify augment ID lifecycle
        run: node --import ./scripts/register-ts-hooks.mjs scripts/augment-id-integrity-check.ts

      - name: Verify runtime registry
        run: node --import ./scripts/register-ts-hooks.mjs scripts/augment-runtime-registry-check.ts

      - name: Run canonical smoke
        run: bash scripts/run-s16-p10-smoke.sh

      - name: Run canonical historical regressions
        run: node --import ./scripts/register-ts-hooks.mjs scripts/canonical-regression-seeds.ts

      - name: Verify clean diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -R -n -E '\b(S|G|P|A)[0-9]{2}\b' src scripts .github/workflows --exclude=legacy-id-map.ts --exclude-dir=archive; then
            echo 'Legacy-style augment ID remains in active code.' >&2
            exit 1
          fi

      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-augment-ids-v2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: migrate augments to permanent AUG ids'
          git push origin HEAD:refactor/augment-id-v2
