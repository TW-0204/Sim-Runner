name: Canonical Source Structure Check

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'scripts/**'
      - 'AGENTS.md'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'scripts/**'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Reject active legacy patch dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E \
            'scripts/apply-v3-stack\.sh|python scripts/apply-[^ ]+\.py|python scripts/run-balance-rework-v3\.py' \
            AGENTS.md .github/workflows scripts src; then
            echo 'Active legacy patch dependency found outside archive.' >&2
            exit 1
          fi

      - name: Reject precision source mutation
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E \
            'writeFileSync\([^\n]*src/lib/simulation/game\.ts|originalGameSource.*simulation/game|SIM_FORCED_AUGMENT_ID|SIM_FORCED_ACQUISITION_INDEX' \
            scripts src; then
            echo 'Runtime simulation source mutation detected.' >&2
            exit 1
          fi

      - name: Verify augment ID lifecycle
        run: node --import ./scripts/register-ts-hooks.mjs scripts/augment-id-integrity-check.ts

      - name: Reject active legacy-style augment IDs
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(S|G|P|A)[0-9]{2}\b' src scripts .github/workflows --exclude=legacy-id-map.ts --exclude-dir=archive; then
            echo 'Legacy-style augment ID found outside the compatibility map/archive.' >&2
            exit 1
          fi

      - name: Reject legacy-style active filenames
        shell: bash
        run: |
          set -euo pipefail
          legacy_files=$(find scripts .github/workflows -type f | grep -E '/(s|g|p|a)[0-9]{2}([._-]|$)' || true)
          if [ -n "$legacy_files" ]; then
            echo "$legacy_files" >&2
            echo 'Legacy-style augment filename found in active paths.' >&2
            exit 1
          fi

      - name: Verify augment runtime registry coverage
        run: node --import ./scripts/register-ts-hooks.mjs scripts/augment-runtime-registry-check.ts

      - name: Run canonical smoke
        run: bash scripts/run-augment-016-037-smoke.sh
