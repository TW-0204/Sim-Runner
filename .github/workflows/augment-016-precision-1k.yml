name: AUG-016 Precision 1K

on:
  push:
    branches:
      - experiment/s16
    paths:
      - '.github/workflows/augment-016-precision-1k.yml'
      - 'src/lib/augments/**'
      - 'src/lib/game/**'
      - 'src/lib/simulation/**'
      - 'scripts/augment-016-precision-run.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Run AUG-016 forced-owner precision
        run: node --import ./scripts/register-ts-hooks.mjs scripts/augment-016-precision-run.ts --games 1000 --output-dir precision-results/augment-016
      - name: Upload AUG-016 precision results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: augment-016-precision-1k
          path: precision-results/augment-016
          if-no-files-found: error
