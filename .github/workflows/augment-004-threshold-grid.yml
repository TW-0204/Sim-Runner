name: AUG-004 Threshold Grid

on:
  push:
    paths:
      - '.github/workflows/augment-004-threshold-grid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  threshold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        threshold: [4, 6, 8, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Run AUG-004 threshold precision
        run: node --import ./scripts/register-ts-hooks.mjs scripts/augment-004-threshold-run.ts --threshold "${{ matrix.threshold }}" --games 1000 --output-dir augment-004-threshold-results
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: augment-004-threshold-${{ matrix.threshold }}
          path: augment-004-threshold-results/
          if-no-files-found: error
          retention-days: 7
