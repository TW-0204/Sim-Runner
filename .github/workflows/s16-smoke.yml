name: Canonical S16 + P10 Smoke

on:
  push:
    paths:
      - '.github/workflows/s16-smoke.yml'
      - 'src/lib/augments/**'
      - 'src/lib/game/**'
      - 'src/lib/simulation/**'
      - 'scripts/run-s16-p10-smoke.sh'
      - 'scripts/s16-precision-run.ts'
      - 'scripts/p10-overpass-probe.ts'
      - 'scripts/stall-fixes-v10-probe.ts'
      - 'scripts/balance-rework-v3-probe.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Run canonical S16 + P10 smoke
        run: bash scripts/run-s16-p10-smoke.sh
