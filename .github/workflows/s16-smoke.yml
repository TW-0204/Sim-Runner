name: S16 + P10 Stack Smoke

on:
  push:
    paths:
      - '.github/workflows/s16-smoke.yml'
      - 'scripts/run-s16-p10-smoke.sh'
      - 'scripts/s16-precision-run.ts'
      - 'scripts/p10-overpass-probe.ts'
      - 'scripts/balance-rework-v3-probe.ts'
      - 'scripts/apply-v3-stack.sh'
      - 'scripts/apply-s16-experiment.py'
      - 'scripts/apply-p10-overpass.py'
      - 'scripts/apply-s15-log-cleanup.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Run current S16 + P10 stack smoke
        run: bash scripts/run-s16-p10-smoke.sh
