name: migrate precision forcing once

on:
  push:
    branches:
      - refactor/canonical-v11
    paths:
      - 'scripts/migrate-precision-forcing-once.py'
      - '.github/workflows/migrate-precision-forcing-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-v11
          fetch-depth: 0
      - name: Refactor precision forcing
        run: python scripts/migrate-precision-forcing-once.py
      - name: Commit runner refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/precision-all-augment-run.ts scripts/precision-special-run.ts
          git commit -m "refactor: stop precision runners from mutating simulation source"
          git push origin HEAD:refactor/canonical-v11
