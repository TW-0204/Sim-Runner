name: Probe Private Source

on:
  push:
    paths:
      - '.github/workflows/probe-private-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try checkout private source
        uses: actions/checkout@v4
        with:
          repository: TW-0204/Augment-Yut
          ref: work/balance-auto-scan-v1
          token: ${{ github.token }}
          path: source

      - name: Confirm simulation files
        run: |
          test -f source/scripts/balance-auto-scan.ts
          test -f source/src/lib/simulation/game.ts
          echo 'PRIVATE_SOURCE_CHECKOUT_OK'
