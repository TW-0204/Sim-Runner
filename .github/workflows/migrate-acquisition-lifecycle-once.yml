name: migrate acquisition lifecycle once

on:
  push:
    branches:
      - refactor/canonical-v11
    paths:
      - 'archive/migrations/refactor-acquisition-lifecycle-once.py'
      - '.github/workflows/migrate-acquisition-lifecycle-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-v11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Consolidate acquisition lifecycle
        run: python archive/migrations/refactor-acquisition-lifecycle-once.py
      - name: Run canonical smoke
        run: bash scripts/run-s16-p10-smoke.sh
      - name: Run historical regressions
        run: node --import ./scripts/register-ts-hooks.mjs scripts/canonical-regression-seeds.ts
      - name: Commit acquisition lifecycle refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/simulation/game.ts
          git commit -m "refactor: route acquisition effects through game lifecycle"
          git push origin HEAD:refactor/canonical-v11
