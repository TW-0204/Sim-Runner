name: Balance Rework V3 Independent 90K

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include:
          - { player_count: 2, batch_id: 1, seed_start: 800000 }
          - { player_count: 2, batch_id: 2, seed_start: 806000 }
          - { player_count: 2, batch_id: 3, seed_start: 812000 }
          - { player_count: 2, batch_id: 4, seed_start: 818000 }
          - { player_count: 2, batch_id: 5, seed_start: 824000 }
          - { player_count: 3, batch_id: 1, seed_start: 900000 }
          - { player_count: 3, batch_id: 2, seed_start: 906000 }
          - { player_count: 3, batch_id: 3, seed_start: 912000 }
          - { player_count: 3, batch_id: 4, seed_start: 918000 }
          - { player_count: 3, batch_id: 5, seed_start: 924000 }
          - { player_count: 4, batch_id: 1, seed_start: 1000000 }
          - { player_count: 4, batch_id: 2, seed_start: 1006000 }
          - { player_count: 4, batch_id: 3, seed_start: 1012000 }
          - { player_count: 4, batch_id: 4, seed_start: 1018000 }
          - { player_count: 4, batch_id: 5, seed_start: 1024000 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Apply current v3 rules
        run: bash scripts/apply-v3-stack.sh
      - name: Apply Round 30 draw cap
        run: python scripts/apply-simulation-round-cap.py
      - name: Verify v3 mechanics
        run: node --import ./scripts/register-ts-hooks.mjs scripts/balance-rework-v3-probe.ts
      - name: Run independent 6K batch
        run: >-
          node --import ./scripts/register-ts-hooks.mjs scripts/balance-independent-batch.ts
          --ruleset two-aug-start-r4-special-slots-v2
          --player-count ${{ matrix.player_count }}
          --batch-id ${{ matrix.batch_id }}
          --seed-start ${{ matrix.seed_start }}
          --games 6000
          --max-rounds 30
          --output-dir independent-results
          --fail-on-incomplete
      - name: Upload batch summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rework-v3-${{ matrix.player_count }}p-${{ matrix.batch_id }}
          path: independent-results/
          if-no-files-found: error
          retention-days: 14

  merge:
    needs: batch
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: rework-v3-*
          path: independent-results
          merge-multiple: true
      - name: Apply current v3 rules
        run: bash scripts/apply-v3-stack.sh
      - name: Apply Round 30 draw cap
        run: python scripts/apply-simulation-round-cap.py
      - name: Merge and analyze 15 independent batches
        run: >-
          node --import ./scripts/register-ts-hooks.mjs scripts/balance-independent-merge.ts
          --input-dir independent-results
          --output-dir independent-merged
          --min-samples 200
          --expected-batches 5
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: balance-rework-v3-90k-merged
          path: independent-merged/
          if-no-files-found: error
          retention-days: 14
