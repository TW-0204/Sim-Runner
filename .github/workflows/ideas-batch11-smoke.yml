name: Augment Ideas Batch 11 Smoke

on:
  push:
    paths:
      - 'scripts/apply-ideas-batch11.py'
      - 'scripts/ideas-batch11-probe.ts'
      - '.github/workflows/ideas-batch11-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Apply confirmed balance patch
        run: python scripts/apply-confirmed-balance-v1.py
      - name: Apply G15 redesign and G01 cap
        run: python scripts/apply-g15-g01-v5.py
      - name: Apply G01 and G15 v6 tuning
        run: python scripts/apply-g01-g15-v6.py
      - name: Apply balance v7 tuning
        run: python scripts/apply-balance-v7.py
      - name: Apply ideas batch 1
        run: python scripts/apply-ideas-batch1.py
      - name: Apply ideas batch 2
        run: python scripts/apply-ideas-batch2.py
      - name: Apply ideas batch 3
        run: python scripts/apply-ideas-batch3.py
      - name: Apply ideas batch 4
        run: python scripts/apply-ideas-batch4.py
      - name: Apply ideas batch 5
        run: python scripts/apply-ideas-batch5.py
      - name: Apply ideas batch 6
        run: python scripts/apply-ideas-batch6.py
      - name: Apply ideas batch 7
        run: python scripts/apply-ideas-batch7.py
      - name: Apply ideas batch 8
        run: python scripts/apply-ideas-batch8.py
      - name: Apply A13 G13 regression fix
        run: python scripts/apply-ideas-batch8-fix.py
      - name: Apply ideas batch 9
        run: python scripts/apply-ideas-batch9.py
      - name: Apply ideas batch 10
        run: python scripts/apply-ideas-batch10.py
      - name: Apply ideas batch 11
        run: python scripts/apply-ideas-batch11.py
      - name: Run A02 mechanic probes
        run: node --import ./scripts/register-ts-hooks.mjs scripts/ideas-batch11-probe.ts
      - name: Run batch 11 smoke scan
        run: node --import ./scripts/register-ts-hooks.mjs scripts/balance-auto-scan.ts --ruleset two-aug-start-r4-special-slots-v2 --games 150 --min-samples 3 --output-dir balance-results/ideas-batch11-smoke --fail-on-incomplete
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ideas-batch11-smoke
          path: balance-results/ideas-batch11-smoke
